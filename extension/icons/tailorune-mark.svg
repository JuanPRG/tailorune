  <title>Tailorune</title>
  <!--
    The Tailorune mark, as supplied. Two filled paths, brand jade #51A68B.
    `currentColor` so the popup header, the icon renderer and a light-ground
    variant can each supply their own without forking the file.

    The viewBox is CROPPED from the delivered 0 0 2048 2066 to the art's own
    bounds plus 6% breathing room. The original wastes 51% of its canvas on
    padding, which at 16px throws away half the pixels the glyph could have
    used -- the difference between legible and mush at toolbar size.

    Art bounds in the original coordinate space: x 401..1775, y 335..1855
    (1374 x 1520, aspect 0.90). Squared here so it drops into a square tile
    without distortion.
  -->
